<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151219">
  <title>Strawberry Chase</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="brand"><span class="brand-mark" aria-hidden="true">🍓</span> Strawberry Chase</span>
      <div class="actions">
        <button id="sound" type="button" aria-pressed="true">Sound on</button>
        <button id="full" type="button">Fullscreen</button>
      </div>
    </header>
    <main class="arcade">
      <section class="console" aria-label="Game controls">
        <h1 id="heading" tabindex="-1">Catch the strawberries.</h1>
        <p id="description">Guide the snake and catch as many strawberries as you can in 60 seconds.</p>
        <div id="overlay">
          <div class="buttons">
            <button id="camera" class="primary" type="button">
              <strong>Play with camera</strong><small>Point with your index finger</small>
            </button>
            <button id="mouse" type="button">
              <strong>Play without camera</strong><small>Use your pointer, touch or arrow keys</small>
            </button>
          </div>
          <p id="note" role="status">Camera frames are processed on your device.</p>
        </div>
        <button id="stop" type="button" hidden>Exit game</button>
      </section>
      <section class="machine" aria-label="Strawberry Chase game">
        <dl class="hud">
          <div><dt>Score</dt><dd id="score">00</dd></div>
          <div class="timer"><dt>Time left</dt><dd id="time">01:00</dd></div>
          <div><dt>Best</dt><dd id="best">00</dd></div>
        </dl>
        <div class="bar" aria-hidden="true"><i id="progress"></i></div>
        <div class="stage" id="stage">
          <video id="video" autoplay muted playsinline aria-hidden="true"></video>
          <canvas id="game" tabindex="-1" aria-label="Playfield" aria-describedby="status"></canvas>
        </div>
        <p id="status" role="status">Choose a control mode to start</p>
      </section>
    </main>
  </div>
  <script type="module" src="./game.js"></script>
</body>
</html>
